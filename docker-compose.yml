services:
  postgres:
    image: postgres:16-alpine
    container_name: insighthub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insighthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: insighthub_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/insighthub?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required. Generate one with: openssl rand -base64 32}"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    container_name: insighthub_worker
    restart: unless-stopped
    command: npx tsx scripts/worker.ts
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/insighthub?schema=public
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
